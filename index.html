<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a0c"><link rel="manifest" href="manifest.json"><title>New Era Habits</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090a0c;color:#f4f5f7;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:760px;margin:auto;padding:20px 15px 45px}.top{display:flex;justify-content:space-between}.logo{font-weight:900;letter-spacing:2px}.muted{color:#9298a3;font-size:13px}.hero,.habit{background:#14161a;border:1px solid #282b31;border-radius:20px}.hero{padding:20px;margin:20px 0}.hero h1{margin:0 0 5px;font-size:27px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{padding:12px;background:#ffffff08;border-radius:13px}.stat b{display:block;font-size:22px}.stat small{color:#9298a3}.progress{height:8px;background:#292c33;border-radius:9px;margin-top:16px;overflow:hidden}.bar{height:100%;background:#e2e5ea}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.btn{background:#e5e7eb;color:#111;border:0;border-radius:11px;padding:9px 13px;font-weight:700}.habit{padding:14px;margin:9px 0;display:flex;align-items:center;gap:12px}.check{width:28px;height:28px;border-radius:50%;border:2px solid #666;background:none;color:#111}.done .check{background:#82dfa6;border-color:#82dfa6}.done .name{text-decoration:line-through;color:#858b95}.name{font-weight:700;flex:1}.meta{font-size:12px;color:#9298a3}.del{background:none;border:0;color:#777;font-size:18px}.empty{text-align:center;border:1px dashed #30333a;border-radius:16px;padding:30px;color:#9298a3}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{aspect-ratio:1;border-radius:7px;background:#1b1e23;display:flex;align-items:center;justify-content:center;font-size:11px;color:#777}.day.full{background:#82dfa6;color:#101812}.day.today{outline:2px solid #eee}dialog{background:#15171b;color:white;border:1px solid #333;border-radius:18px;padding:20px;width:90%;max-width:400px}input{width:100%;padding:12px;background:#0c0e11;color:white;border:1px solid #333;border-radius:10px;margin:8px 0 15px}menu{display:flex;justify-content:flex-end;gap:8px;padding:0}
</style></head><body><main class="app"><div class="top"><b class="logo">NEW ERA</b><span class="muted" id="date"></span></div>
<section class="hero"><h1>Build the new you.</h1><span class="muted">Small actions. Every day.</span><div class="stats"><div class="stat"><b id="done">0</b><small>DONE TODAY</small></div><div class="stat"><b id="total">0</b><small>HABITS</small></div><div class="stat"><b id="best">0</b><small>BEST STREAK</small></div></div><div class="progress"><div id="bar" class="bar"></div></div></section>
<div class="section"><b>Today's habits</b><button class="btn" onclick="openAdd()">＋ Add habit</button></div><div id="list"></div>
<div class="section"><b>Last 28 days</b></div><div class="cal" id="cal"></div></main>
<dialog id="dlg"><form method="dialog" onsubmit="add(event)"><h2>New habit</h2><input id="name" required maxlength="40" placeholder="e.g. Workout"><menu><button class="btn" value="cancel">Cancel</button><button class="btn" value="ok">Add</button></menu></form></dialog>
<script>
const K="NEHT";let d=JSON.parse(localStorage.getItem(K)||'{"habits":[]}');const key=x=>new Date(x).toISOString().slice(0,10),today=key(new Date());date.textContent=new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
function save(){localStorage.setItem(K,JSON.stringify(d));render()}function openAdd(){dlg.showModal();name.focus()}function add(e){e.preventDefault();d.habits.push({id:Date.now(),name:name.value.trim(),days:[]});name.value="";dlg.close();save()}
function toggle(id){let h=d.habits.find(x=>x.id==id),i=h.days.indexOf(today);i<0?h.days.push(today):h.days.splice(i,1);save()}
function removeH(id){if(confirm("Delete this habit?")){d.habits=d.habits.filter(x=>x.id!=id);save()}}
function bestH(h){let a=[...new Set(h.days)].sort(),b=0,c=0;for(let i=0;i<a.length;i++){c=i&&((new Date(a[i])-new Date(a[i-1]))/864e5===1)?c+1:1;b=Math.max(b,c)}return b}
function current(h){let c=0,x=new Date();while(h.days.includes(key(x))){c++;x.setDate(x.getDate()-1)}return c}
function esc(s){return s.replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
function render(){let done=d.habits.filter(h=>h.days.includes(today)).length;document.getElementById("done").textContent=done;document.getElementById("total").textContent=d.habits.length;document.getElementById("best").textContent=d.habits.reduce((m,h)=>Math.max(m,bestH(h)),0);bar.style.width=(d.habits.length?done/d.habits.length*100:0)+"%";list.innerHTML=d.habits.length?"":"<div class='empty'>Add your first habit to begin.</div>";d.habits.forEach(h=>{let ok=h.days.includes(today);list.insertAdjacentHTML("beforeend",`<div class="habit ${ok?"done":""}"><button class="check" onclick="toggle(${h.id})">${ok?"✓":""}</button><div class="name">${esc(h.name)}<div class="meta">${current(h)} day current streak</div></div><span class="meta">best ${bestH(h)}</span><button class="del" onclick="removeH(${h.id})">×</button></div>`)});
cal.innerHTML="";for(let i=27;i>=0;i--){let x=new Date();x.setDate(x.getDate()-i);let k=key(x),full=d.habits.length&&d.habits.every(h=>h.days.includes(k));cal.insertAdjacentHTML("beforeend",`<div class="day ${full?"full ":""}${k==today?"today":""}">${x.getDate()}</div>`)}}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");render();
</script></body></html>
